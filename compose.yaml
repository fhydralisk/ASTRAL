services:
  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DB_DIALECT: postgresql
      DATABASE_URL: postgresql://astral:${DB_PASSWORD:?Set DB_PASSWORD}@database:5432/astral
      HARNESS_URL: http://harness:8000
      HARNESS_SERVICE_TOKEN: ${HARNESS_SERVICE_TOKEN:?Set HARNESS_SERVICE_TOKEN}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?Set CREDENTIAL_MASTER_KEY}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      database:
        condition: service_healthy
      harness:
        condition: service_healthy
    networks: [internal, public]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
  harness:
    build: .
    command: [serve, --host, 0.0.0.0, --port, "8000", --root, /data/harness-v2]
    environment:
      HARNESS_SERVICE_TOKEN: ${HARNESS_SERVICE_TOKEN:?Set HARNESS_SERVICE_TOKEN}
    volumes:
      - harness-data:/data
    networks: [internal, public]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 8g
    cpus: 4
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: astral
      POSTGRES_DB: astral
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - web-database:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U astral -d astral"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
networks:
  internal:
    internal: true
  public: {}
volumes:
  harness-data: {}
  web-database: {}
