name: Decoupled Web and Harness
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,tools]'
      - run: pytest --ignore=tests/playground --ignore=tests/deploy
      - run: python scripts/export_harness_openapi.py
      - run: git diff --exit-code -- contracts/harness.openapi.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run api:generate && git diff --exit-code -- src/lib/harness-schema.d.ts src/lib/scientific-routes.ts
      - run: npm test && npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: web/test-results
  databases:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgresql, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: astral
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: astral
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run tests/repository.integration.test.ts
        env:
          INTEGRATION_DIALECT: ${{ matrix.dialect }}
          INTEGRATION_DATABASE_URL: ${{ matrix.dialect == 'postgresql' && 'postgresql://postgres:test@localhost:5432/astral' || 'mysql://root:test@localhost:3306/astral' }}
